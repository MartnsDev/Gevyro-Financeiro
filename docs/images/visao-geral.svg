<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title"><title id="title">Apresentação ilustrativa do Gevyro Finanças, com dados fictícios</title><rect width="1440" height="900" fill="#f5f8f6"/><g font-family="Inter, Arial, sans-serif"><rect x="30" y="30" width="1380" height="800" rx="18" fill="#fff" stroke="#e5ebe8"/><rect x="30" y="30" width="240" height="800" rx="18" fill="#fff" stroke="#e5ebe8"/><text x="64" y="91" fill="#172b24" font-size="38" font-weight="700">gevyro</text><text x="64" y="119" fill="#00875f" font-size="14" font-weight="700">FINANÇAS</text><rect x="48" y="160" width="203" height="46" rx="12" fill="#e8f6ef" stroke="#e8f6ef"/><text x="66" y="190" fill="#00875f" font-size="17" font-weight="600">Visão geral</text><text x="66" y="255" fill="#66756e" font-size="17" font-weight="400">Movimentações</text><text x="66" y="320" fill="#66756e" font-size="17" font-weight="400">Contas e carteiras</text><text x="66" y="385" fill="#66756e" font-size="17" font-weight="400">Cartões e faturas</text><text x="66" y="450" fill="#66756e" font-size="17" font-weight="400">Planejamento</text><text x="66" y="515" fill="#66756e" font-size="17" font-weight="400">Metas</text><text x="66" y="580" fill="#66756e" font-size="17" font-weight="400">Relatórios</text><text x="310" y="92" fill="#172b24" font-size="32" font-weight="700">Mais clareza para o seu dinheiro.</text><text x="310" y="129" fill="#66756e" font-size="18" font-weight="400">Tudo o que importa, em um só lugar.</text><rect x="1160" y="65" width="205" height="49" rx="12" fill="#00875f" stroke="#00875f"/><text x="1180" y="96" fill="#fff" font-size="17" font-weight="600">Nova movimentação</text><rect x="310" y="170" width="330" height="141" rx="18" fill="#fff" stroke="#e5ebe8"/><text x="333" y="204" fill="#66756e" font-size="17" font-weight="400">Saldo disponível</text><text x="333" y="250" fill="#172b24" font-size="30" font-weight="700">R$ 8.420,00</text><text x="333" y="283" fill="#66756e" font-size="14" font-weight="400">Contas e carteiras</text><rect x="665" y="170" width="330" height="141" rx="18" fill="#fff" stroke="#e5ebe8"/><text x="688" y="204" fill="#66756e" font-size="17" font-weight="400">Receitas do mês</text><text x="688" y="250" fill="#172b24" font-size="30" font-weight="700">R$ 6.500,00</text><text x="688" y="283" fill="#66756e" font-size="14" font-weight="400">Entradas registradas</text><rect x="1020" y="170" width="330" height="141" rx="18" fill="#fff" stroke="#e5ebe8"/><text x="1043" y="204" fill="#66756e" font-size="17" font-weight="400">Despesas do mês</text><text x="1043" y="250" fill="#172b24" font-size="30" font-weight="700">R$ 3.280,00</text><text x="1043" y="283" fill="#66756e" font-size="14" font-weight="400">Saídas registradas</text><rect x="310" y="341" width="675" height="255" rx="18" fill="#fff" stroke="#e5ebe8"/><text x="335" y="381" fill="#172b24" font-size="22" font-weight="600">Seu fluxo financeiro</text><text x="335" y="409" fill="#66756e" font-size="16" font-weight="400">Acompanhe entradas e saídas ao longo do tempo.</text><path d="M340 450 H950" stroke="#edf1ef"/><path d="M340 500 H950" stroke="#edf1ef"/><path d="M340 550 H950" stroke="#edf1ef"/><path d="M340 545 C390 530 420 490 465 502 S545 550 600 495 S690 500 750 458 S860 480 950 425" fill="none" stroke="#00875f" stroke-width="4" stroke-linecap="round"/><rect x="1010" y="341" width="340" height="255" rx="18" fill="#fff" stroke="#e5ebe8"/><text x="1035" y="381" fill="#172b24" font-size="20" font-weight="600">Um plano para cada meta</text><text x="1035" y="433" fill="#172b24" font-size="17" font-weight="400">Reserva de emergência</text><text x="1035" y="468" fill="#00875f" font-size="18" font-weight="600">R$ 4.000 de R$ 10.000</text><rect x="1035" y="490" width="285" height="10" rx="5" fill="#e8eeeb" stroke="#e5ebe8"/><rect x="1035" y="490" width="114" height="10" rx="5" fill="#00875f" stroke="#00875f"/><text x="1035" y="543" fill="#66756e" font-size="16" font-weight="400">Cada passo conta.</text><rect x="310" y="626" width="1040" height="167" rx="18" fill="#fff" stroke="#e5ebe8"/><text x="335" y="666" fill="#172b24" font-size="22" font-weight="600">Organização que acompanha sua rotina</text><text x="335" y="707" fill="#172b24" font-size="17" font-weight="400">Mercado da semana</text><text x="1190" y="707" fill="#00875f" font-size="16" font-weight="400">Pago</text><text x="335" y="737" fill="#172b24" font-size="17" font-weight="400">Internet residencial</text><text x="1190" y="737" fill="#00875f" font-size="16" font-weight="400">Previsto</text><text x="335" y="767" fill="#172b24" font-size="17" font-weight="400">Salário</text><text x="1190" y="767" fill="#00875f" font-size="16" font-weight="400">Recebido</text><text x="48" y="873" fill="#66756e" font-size="15" font-weight="400">Apresentação ilustrativa • valores fictícios • não é captura de tela</text></g></svg>