<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title"><title id="title">Apresentação ilustrativa do Gevyro Finanças, com dados fictícios</title><rect width="1440" height="600" fill="#0c1e16"/><g font-family="Inter, Arial, sans-serif"><text x="65" y="86" fill="#f0f7f3" font-size="42" font-weight="700">Seu espaço. Do seu jeito.</text><text x="65" y="132" fill="#a4b6ad" font-size="21" font-weight="400">Temas claro e escuro, privacidade dos valores e uma experiência sem excesso.</text><rect x="65" y="190" width="625" height="300" rx="22" fill="#fff" stroke="#2a4438"/><text x="97" y="237" fill="#172b24" font-size="23" font-weight="700">gevyro finanças</text><text x="97" y="300" fill="#66756e" font-size="19" font-weight="400">Saldo disponível</text><text x="97" y="352" fill="#172b24" font-size="40" font-weight="700">•••••</text><rect x="97" y="397" width="560" height="52" rx="12" fill="#00875f" stroke="#00875f"/><text x="255" y="430" fill="#fff" font-size="18" font-weight="600">Seu controle, sua rotina</text><rect x="750" y="190" width="625" height="300" rx="22" fill="#152b22" stroke="#2a4438"/><text x="782" y="237" fill="#f0f7f3" font-size="23" font-weight="700">gevyro finanças</text><text x="782" y="300" fill="#a4b6ad" font-size="19" font-weight="400">Saldo disponível</text><text x="782" y="352" fill="#f0f7f3" font-size="40" font-weight="700">•••••</text><rect x="782" y="397" width="560" height="52" rx="12" fill="#00875f" stroke="#00875f"/><text x="940" y="430" fill="#fff" font-size="18" font-weight="600">Seu controle, sua rotina</text><text x="65" y="550" fill="#a4b6ad" font-size="16" font-weight="400">Apresentação ilustrativa • recursos sujeitos à configuração do ambiente</text></g></svg>