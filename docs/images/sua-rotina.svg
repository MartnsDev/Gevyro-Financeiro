<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title"><title id="title">Apresentação ilustrativa do Gevyro Finanças, com dados fictícios</title><rect width="1440" height="600" fill="#f5f8f6"/><g font-family="Inter, Arial, sans-serif"><text x="65" y="90" fill="#172b24" font-size="43" font-weight="700">Menos preocupação. Mais direção.</text><text x="65" y="135" fill="#66756e" font-size="22" font-weight="400">Do primeiro registro ao próximo objetivo, cada decisão ganha contexto.</text><rect x="65" y="195" width="410" height="265" rx="18" fill="#fff" stroke="#e5ebe8"/><rect x="90" y="225" width="55" height="7" rx="3" fill="#00875f" stroke="#00875f"/><text x="90" y="285" fill="#172b24" font-size="25" font-weight="600">Organize o presente</text><text x="90" y="335" fill="#66756e" font-size="18" font-weight="400">Contas, receitas, despesas e cartões.</text><text x="90" y="370" fill="#66756e" font-size="17" font-weight="400">Saiba o que entrou, saiu e está previsto.</text><rect x="505" y="195" width="410" height="265" rx="18" fill="#fff" stroke="#e5ebe8"/><rect x="530" y="225" width="55" height="7" rx="3" fill="#00875f" stroke="#00875f"/><text x="530" y="285" fill="#172b24" font-size="25" font-weight="600">Enxergue os compromissos</text><text x="530" y="335" fill="#66756e" font-size="18" font-weight="400">Parcelas, faturas e assinaturas.</text><text x="530" y="370" fill="#66756e" font-size="17" font-weight="400">Antecipe o impacto dos próximos meses.</text><rect x="945" y="195" width="410" height="265" rx="18" fill="#fff" stroke="#e5ebe8"/><rect x="970" y="225" width="55" height="7" rx="3" fill="#00875f" stroke="#00875f"/><text x="970" y="285" fill="#172b24" font-size="25" font-weight="600">Construa o futuro</text><text x="970" y="335" fill="#66756e" font-size="18" font-weight="400">Metas, reservas e cenários.</text><text x="970" y="370" fill="#66756e" font-size="17" font-weight="400">Transforme intenção em um plano.</text><text x="65" y="530" fill="#00875f" font-size="27" font-weight="600">Seu dinheiro, com clareza.</text></g></svg>